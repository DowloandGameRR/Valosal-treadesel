<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş / Kayıt Ol</title>
    <!-- Tasarımın bozulmaması için Tailwind veya kendi CSS projenizin linkini buraya ekleyebilirsiniz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Koyu Tema ve CSS Token'ları (Mevcut tasarımınız korundu) */
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --primary: #6366f1; /* İndigo rengi */
            --primary-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #374151;
            --input-border: #4b5563;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid #2d3748;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-radius: 0.75rem;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .input-field {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-top: 0.25rem;
            box-sizing: border-box;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .logo-img {
            height: 48px; /* PNG logonuzun boyutu */
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- 3. Logo ve PNG Sorunu Çözüldü -->
        <!-- Sol üst/Merkez logo PNG olarak güncellendi -->
        <div class="flex justify-center mb-6">
            <img src="assets/logo.png" alt="Site Logosu" class="logo-img" onerror="this.src='https://via.placeholder.com/150x50/1e1e1e/ffffff?text=Logo.png'">
        </div>

        <h2 class="text-2xl font-bold text-center mb-2" id="form-title">Giriş Yap</h2>
        
        <!-- Hata ve Bilgi Mesajları İçin Alan -->
        <div id="auth-message" class="text-sm text-center p-2 rounded mb-4 hidden"></div>

        <form id="auth-form">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-400">E-posta Adresi</label>
                <input type="email" id="email" class="input-field" required placeholder="ornek@mail.com">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-400">Şifre</label>
                <input type="password" id="password" class="input-field" required placeholder="••••••••">
            </div>
            
            <button type="submit" id="submit-btn" class="btn-primary">Giriş Yap</button>
        </form>

        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-700"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2" style="background-color: var(--bg-card); color: var(--text-muted);">veya</span>
            </div>
        </div>

        <!-- 2. Google ile Giriş Butonu -->
        <button id="google-btn" class="w-full flex items-center justify-center py-2 px-4 bg-white text-gray-900 rounded-md font-semibold text-sm hover:bg-gray-100 transition cursor-pointer border-none">
            <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google ile devam et
        </button>

        <div class="text-center mt-6">
            <p class="text-sm text-gray-400">
                <span id="toggle-text">Hesabın yok mu?</span>
                <a href="#" id="toggle-mode" class="text-indigo-400 hover:text-indigo-300 font-semibold ml-1">Kayıt Ol</a>
            </p>
        </div>
    </div>

    <!-- Firebase SDK Kurulumu (Modül olarak) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // KENDİ FIREBASE BİLGİLERİNİ BURAYA YAPIŞTIR
        const firebaseConfig = {
            apiKey: "SENIN_API_KEY",
            authDomain: "PROJE_ID.firebaseapp.com",
            projectId: "PROJE_ID",
            storageBucket: "PROJE_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // Element Seçimleri
        const form = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const googleBtn = document.getElementById('google-btn');
        const toggleMode = document.getElementById('toggle-mode');
        const toggleText = document.getElementById('toggle-text');
        const formTitle = document.getElementById('form-title');
        const authMessage = document.getElementById('auth-message');

        let isLoginMode = true;

        // Mesaj Gösterici
        function showMessage(msg, isError = false) {
            authMessage.textContent = msg;
            authMessage.className = `text-sm text-center p-3 rounded mb-4 block ${isError ? 'bg-red-900/50 text-red-200 border border-red-700' : 'bg-green-900/50 text-green-200 border border-green-700'}`;
        }

        // Giriş / Kayıt Geçiş Mantığı
        toggleMode.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            formTitle.textContent = isLoginMode ? "Giriş Yap" : "Kayıt Ol";
            submitBtn.textContent = isLoginMode ? "Giriş Yap" : "Kayıt Ol";
            toggleText.textContent = isLoginMode ? "Hesabın yok mu?" : "Zaten hesabın var mı?";
            toggleMode.textContent = isLoginMode ? "Giriş Yap" : "Kayıt Ol";
            authMessage.classList.add('hidden'); // Ekran değişince hataları temizle
        });

        // 1. Kayıt ve Giriş Sorunu Giderildi (E-posta/Şifre)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;
            submitBtn.disabled = true;

            try {
                if (isLoginMode) {
                    // Normal Giriş
                    await signInWithEmailAndPassword(auth, email, password);
                    showMessage("Başarıyla giriş yapıldı. Yönlendiriliyor...");
                    // window.location.href = '/ana-sayfa.html';
                } else {
                    // Kayıt Ol ve Firestore'a Veriyi İşle
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    
                    // Firestore kaydı oluşturularak "kayıtlı ama giriş yapamıyor" döngüsü kırıldı
                    await setDoc(doc(db, "users", user.uid), {
                        uid: user.uid,
                        email: user.email,
                        createdAt: new Date().toISOString(),
                        provider: "email",
                        role: "user"
                    });
                    
                    showMessage("Kayıt başarılı! Oturum açıldı.");
                    // window.location.href = '/ana-sayfa.html';
                }
            } catch (error) {
                console.error("Auth Hatası:", error);
                
                // Hata Yönetimi
                if (error.code === 'auth/email-already-in-use') {
                    showMessage("Bu e-posta zaten kayıtlı. Lütfen giriş yapın.", true);
                    // Kullanıcıyı otomatik giriş moduna al
                    if(!isLoginMode) toggleMode.click();
                } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
                    showMessage("E-posta veya şifre hatalı.", true);
                } else if (error.code === 'auth/user-not-found') {
                    showMessage("Böyle bir hesap bulunamadı, lütfen kayıt olun.", true);
                } else {
                    showMessage("İşlem sırasında bir hata oluştu: " + error.message, true);
                }
            } finally {
                submitBtn.disabled = false;
            }
        });

        // 2. Google ile Giriş Düzeltildi (Eksik Firestore Kaydı Eklendi)
        googleBtn.addEventListener('click', async () => {
            try {
                googleBtn.disabled = true;
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;

                // currentUserDoc eksikliği giderildi: Firestore'da kullanıcı var mı kontrol et
                const userDocRef = doc(db, "users", user.uid);
                const userDocSnap = await getDoc(userDocRef);

                // Eğer kullanıcı ilk kez Google ile giriyorsa Firestore'a kaydet
                if (!userDocSnap.exists()) {
                    await setDoc(userDocRef, {
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || "Kullanıcı",
                        photoURL: user.photoURL || "",
                        createdAt: new Date().toISOString(),
                        provider: "google",
                        role: "user"
                    });
                }

                showMessage("Google ile giriş başarılı!");
                // Yönlendirme kodu: window.location.href = '/ana-sayfa.html';

            } catch (error) {
                console.error("Google Auth Hatası:", error);
                showMessage("Google ile giriş iptal edildi veya bir hata oluştu.", true);
            } finally {
                googleBtn.disabled = false;
            }
        });

    </script>
</body>
</html>
